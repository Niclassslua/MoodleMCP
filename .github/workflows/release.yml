name: Release
on:
  push:
    tags: ['v*']
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Build archives
        run: |
          mkdir -p dist
          for target in darwin/amd64 darwin/arm64 linux/amd64 linux/arm64 windows/amd64 windows/arm64; do
            os=${target%/*}
            arch=${target#*/}
            name=mcd_${os}_${arch}
            mkdir -p "dist/$name"
            executable=mcd
            if [ "$os" = windows ]; then executable=mcd.exe; fi
            CGO_ENABLED=0 GOOS=$os GOARCH=$arch go build -trimpath -o "dist/$name/$executable" ./cmd/mcd
            cp LICENSE README.md "dist/$name/"
            cp -R chatgpt-marketplace "dist/$name/"
            if [ "$os" = windows ]; then
              (cd dist && zip -qr "$name.zip" "$name")
            else
              tar -czf "dist/$name.tar.gz" -C dist "$name"
            fi
            rm -r "dist/$name"
          done
          (cd dist && sha256sum *.tar.gz *.zip > checksums.txt)
      - name: Sign checksums
        env:
          RELEASE_SIGNING_KEY: ${{ secrets.RELEASE_SIGNING_KEY }}
        run: |
          # Ed25519 over checksums.txt; the matching public key is release-signing.pub.pem
          key="$RUNNER_TEMP/signing-key.pem"
          (umask 077; printf '%s\n' "$RELEASE_SIGNING_KEY" > "$key")
          openssl pkeyutl -sign -rawin -inkey "$key" -in dist/checksums.txt -out dist/checksums.txt.sig
          rm "$key"
          openssl pkeyutl -verify -rawin -pubin -inkey release-signing.pub.pem -in dist/checksums.txt -sigfile dist/checksums.txt.sig
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/* --generate-notes
